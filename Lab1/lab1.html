<html>
    <head>
        <title>Lab Task 1</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <section class="container">
            <h1>Welcome to Pental Shop</h1>
            <table>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
                <tr>
                    <td>Pencils</td>
                    <td>100</td>
                    <td>In Stock</td>
                </tr>
                </tr>
                <tr>
                    <td>Notebooks</td>
                    <td>50</td>
                    <td>Low Stock</td>
                </tr>
                </tr>
                <tr>
                    <td>Markers</td>
                    <td>15</td>
                    <td>In Stock</td>
                </tr>
            </table>
            <form>
                <h2>Contact Information</h2>
                <table>
                    <tr>
                        <td>Name</td>
                        <td><input type="text" name="name"></td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td><input type="email" name="email"></td>
                    </tr>
                    <tr>
                        <td>Message</td>
                        <td><textarea name="message" cols="20" rows="5"></textarea></td>
                    </tr>
                    
                    <tr>
                        <td></td>
                        <td><input type="submit" class="submitBtn" name="submit"></td>
                    </tr>
                </table>
            </form>
        </section>
    </body>
</html>
