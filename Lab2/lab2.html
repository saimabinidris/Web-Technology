        <td>Email</td>
        </tr>

        <td><input type="email" placeholder="your.email@example.com"></td>

        <td>Age(Number)</td>
        </tr>

        </tr>
         <tr>
        <td>Experiment Date</td>
        <td>Phone Number(Tel)</td>
        </tr>
        <tr>
            <td><input type="date"></td>
        <td><input type="number" placeholder="+880xxxxxxxxxx"></td>
        </tr>
       
        
        
        </table>
        <table>
            <button>Submit</button>
            <button>Clear</button>
        </table>
        </section>

        </fieldset>
    </body>
