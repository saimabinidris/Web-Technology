<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <fieldset>
        <legend><h2>Registration Form</h2></legend>
        <form onsubmit="return registration();">
            <table>
                <tr>
                    <td>First Name:</td>
                    <td>
                        <input type="text" id="firstName">
                        
                    </td>
                    <td><p id="fnameError" style="font-size: 10px; color:red"></p></td>
                </tr>
                <tr>
                    <td>Last Name:</td>
                    <td><input type="text" id="lastName"></td>
                    <td><p id="lnameError" style="font-size: 10px; color:red"></p></td>
                </tr>
                <tr>
                    <td>Student ID:</td>
                    <td><input type="text" id="studentID"></td>
                    <td><p id="studentIDError" style="font-size: 10px; color:red"></p></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email" id="email"></td>
                    <td><p id="emailError" style="font-size:10px; color:red"></p></td>
                </tr>
                <tr>
                    <td>Credit Completed:</td>
                    <td><input type="number" id="credit"></td>
                    <td><p id="creditError" style="font-size: 10px; color:red"></p></td>
                </tr>
                <tr>
                    <td>Department:</td>
                    <td>
                        <select id="department">
                            <option value="">Select Department</option>
                            <option>CSE</option>
                            <option>EEE</option>
                            <option>BBA</option>
                            <option>Architecture</option>
                            <option>English</option>
                        </select>
                        
                    </td>
                    <td><p id="departmentError" style="font-size: 10px; color:red"></p></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="Submit"></td>
                </tr>
            </table>
        </form>

        <h2>Registered Student List</h2>
        <table id="studentTable" border="1" style="width:100%; text-align:left;">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Student ID</th>
                    <th>Email</th>
                    <th>Credit Completed</th>
                    <th>Department</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </fieldset>
</body>
</html>
