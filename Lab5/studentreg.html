<html>
  <head>
    <script src="script.js"></script>
  </head>
  <body>
    <h1>Student Registration</h1>
    <form onsubmit="return validateForm()">
        <table>
            <tr>
                <td>First Name:</td>
                <td><input type="text" id="firstName">
                <p id="fnameError" style="font-size: 10px; color:red"></p>
                </td>
                <td></td>
            </tr>
            <tr>
                <td>Last Name:</td>
                <td><input type="text" id="lastName"></td>
                <td><p id="lnameError" style="font-size: 10px; color:red"></p>
                </td>
                
            </tr>
             <tr>
                <td>Student ID:</td>
                <td><input type="number" id="studentID"></td>
                <td><p id="studentIDError"></p></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="" id="email"></td>
                <td><p id="emailError" style="font-size:10px; color:red"></p></td>
            </tr>
            <tr>
                <td>Credit Completed:</td>
                <td><input type="number" id="credit"></td>
                <td><p id="creditError"></p></td>
            </tr>
            <tr>
            <td>Department:</td>
            <td><select id="Department">
            <option value="">Select Department</option>
            <option>CSE</option>
            <option>EEE</option>
            <option>BBA</option>
            <option>Architecture</option>
            <option>English</option></td>
        </select>
        </tr>
        
            <tr>
                <td></td>
                <td><input type="submit" value="Submit"></td>
            </tr>
          
        </table>
         <h2>Registered Student List</h2>

    <table id="studentTable">
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Student ID</th>
            <th>Email</th>
            <th>Credit</th>
            <th>Department</th>
        </tr>
    </table>
    
    </form>
  </body>
</html>
